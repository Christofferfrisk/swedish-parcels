[project]
name = "swedish-parcels"
version = "0.1.0"
description = "Home Assistant integration that tracks Swedish parcel deliveries by parsing shipping notification emails."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Christoffer" }]
dependencies = [
    "python-dotenv>=1.0.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-watch>=4.2",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
parse-eml = "swedish_parcels.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swedish_parcels"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.13"
